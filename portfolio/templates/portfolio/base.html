<!-- portfolio/templates/portfolio/base.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'portfolio/styles.css' %}">
    <style>
        .hamburger { display: none; font-size: 1.5rem; cursor: pointer; background: none; border: none; color: white; }
        @media (max-width: 768px) {
            header nav { display: none; flex-direction: column; width: 100%; }
            header nav.mostrar { display: flex; }
            .hamburger { display: block; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Portfolio</h1>
        <button class="hamburger">&#9776;</button>
        <nav>
            <a href="{% url 'portfolio_index' %}">Início</a>
            <a href="{% url 'licenciatura' %}">Licenciatura</a>
            <a href="{% url 'docentes' %}">Docentes</a>
            <a href="{% url 'ucs' %}">UCs</a>
            <a href="{% url 'projetos' %}">Projetos</a>
            <a href="{% url 'tecnologias' %}">Tecnologias</a>
            <a href="{% url 'tfcs' %}">TFCs</a>
            <a href="{% url 'competencias' %}">Competências</a>
            <a href="{% url 'formacoes' %}">Formações</a>
            <a href="{% url 'makingof' %}">Making Of</a>
            <a href="{% url 'sobre' %}">Sobre</a>
            <a href="{% url 'artigos' %}">Artigos</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout ({{ request.user.username }})</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'registo' %}">Registar</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2026</p>
    </footer>
    <script>
        const menu = document.querySelector('nav');
        const botao = document.querySelector('.hamburger');
        botao.addEventListener('click', () => {
            menu.classList.toggle('mostrar');
        });
    </script>
</body>
</html>
